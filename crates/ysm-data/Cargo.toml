[package]
name = "ysm-data"
description = "Data access for the YSM Summon Editor: SQL Server, MariaDB, PostgreSQL, settings and asset index."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ysm-core.workspace = true
rust_decimal = { workspace = true, features = ["db-postgres"] }
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
mysql = { version = "28", default-features = false, features = ["minimal-rust", "native-tls"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls", "rust_decimal"] }
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tokio-postgres = "0.7"

[lints]
workspace = true
