[workspace]
resolver = "3"
members = ["crates/ysm-core", "crates/ysm-data", "crates/ysm-summon-editor"]

[workspace.package]
version = "0.1.2-alpha"
edition = "2024"
rust-version = "1.88"
authors = ["YoSiem"]
license = "MIT"
repository = "https://github.com/YoSiem/YSMSummonEditor"

[workspace.dependencies]
ysm-core = { path = "crates/ysm-core" }
ysm-data = { path = "crates/ysm-data" }

rust_decimal = { version = "1", default-features = false, features = ["std"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
too_many_arguments = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

# Keep UI code debuggable but make dependencies (egui tessellation, image decoding) fast in dev builds.
[profile.dev.package."*"]
opt-level = 2
